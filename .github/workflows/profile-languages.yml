name: Update profile languages
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/profile-languages.yml']
permissions:
  contents: write
concurrency:
  group: profile-languages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: dev
      - name: Generate language card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=HendrikD2005&layout=donut-vertical&langs_count=8&theme=github_dark&hide_border=false&border_radius=12&border_color=30363d&hide=C,C%2B%2B,Swift,CMake,JavaScript&size_weight=0.25&count_weight=0.75
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'
      - name: Validate SVG before publishing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          svg = Path('profile/top-langs.svg').read_text()
          assert ET.fromstring(svg).tag == '{http://www.w3.org/2000/svg}svg'
          for message in ('Something went wrong', 'rate limit', 'error fetching'):
              assert message.lower() not in svg.lower(), 'Refusing to publish an error card'
          PY
      - name: Publish successful update to dev
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/top-langs.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh cached language card'
          git push origin HEAD:dev
